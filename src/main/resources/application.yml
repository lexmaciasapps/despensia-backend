spring:
  config:
    import: optional:file:.env.properties
  profiles:
    active: local
  application:
    name: despensia-backend

---
# Default profile (production-ready defaults)
spring:
  config:
    activate:
      on-profile: default

  # PostgreSQL (JPA)
  datasource:
    url: jdbc:postgresql://localhost:5432/despensia
    username: ${DB_USERNAME:despensia}
    password: ${DB_PASSWORD:despensia}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  # MongoDB
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/despensia}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.despensia"

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

---
# Local profile (development overrides)
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    validate-on-migrate: false

  # DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

---
# Spring AI — OpenAI-compatible endpoint (LM Studio)
spring:
  config:
    activate:
      on-profile: default
  
  ai:
    openai:
      api-key: sk-random-non-required-for-lm-studio
      base-url: http://localhost:1234/v1/
      chat:
        options:
          model: llama-3.2-vision

# Logging
logging:
  level:
    com.despensia: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
