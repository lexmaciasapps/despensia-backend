# Local development overrides — loaded via spring.profiles.active=local
# All connection details default to localhost; override per environment.
# Secrets are loaded via .env (see spring.config.import in application.yml)

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/despensia
    username: ${DB_USERNAME:despensia}
    password: ${DB_PASSWORD:despensia}

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/despensia}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # TODO(jwt-security): Re-enable SASL authentication when JWT security layer is implemented.
    # Current config (disabled for local development — Kafka container runs without auth):
    # producer:
    #   properties:
    #     sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:kafka}" password="${KAFKA_PASSWORD:kafka123}";
    #     sasl.mechanism: PLAIN
    #     security.protocol: SASL_PLAINTEXT
    # consumer:
    #   properties:
    #     sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:kafka}" password="${KAFKA_PASSWORD:kafka123}";
    #     sasl.mechanism: PLAIN
    #     security.protocol: SASL_PLAINTEXT

# LM Studio Configuration
lm-studio:
  url: http://localhost:1234

# Spring AI — LM Studio (local vision model for product scanning)
spring.ai.openai.api-key: sk-local-lm-studio-not-required

# Security Configuration for Actuator (Management Port)
# Only exposed on port 9090 to avoid public access on the main app port (8080)
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
